name: Build Windows Installer

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Run application tests
        run: npm test

      - name: Configure native VST3 host
        run: cmake -S native/vst-host -B native/vst-host/build -G "Visual Studio 17 2022" -A x64

      - name: Build native VST3 host
        run: cmake --build native/vst-host/build --config Release --parallel

      - name: Verify native executable exists
        shell: pwsh
        run: |
          $hostExe = "native/vst-host/build/Release/PianoVstHost.exe"
          if (!(Test-Path $hostExe)) { throw "VST3 host executable was not produced: $hostExe" }

      - name: Build Windows installer
        run: npm run dist:win

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: piano-trainer-windows-installer
          path: dist/Piano-Trainer-Setup-*-x64.exe
          if-no-files-found: error
          retention-days: 14
